name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: olist
          POSTGRES_PASSWORD: olist
          POSTGRES_DB: warehouse
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U olist -d warehouse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LANDING_DIR: tests/fixtures/landing
      DBT_PROFILES_DIR: dbt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Unit tests
        run: pytest -q

      - name: Ingest fixture sample (land -> silver -> warehouse)
        run: |
          python -m olist_pipeline.cli land
          python -m olist_pipeline.cli silver
          python -m olist_pipeline.cli load --mode full

      - name: dbt build (models + tests + snapshot)
        working-directory: dbt
        run: |
          dbt deps --profiles-dir .
          dbt build --profiles-dir .

      - name: Incremental run is idempotent
        run: |
          python -m olist_pipeline.cli load --mode month --month 2018-01
          cd dbt && dbt build --profiles-dir . --select fct_orders+
