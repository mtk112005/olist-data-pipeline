version: 2
models:
- name: stg_orders
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
  - name: customer_id
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('stg_customers')
          field: customer_id
  - name: order_status
    data_tests:
    - accepted_values:
        arguments:
          values:
          - created
          - approved
          - invoiced
          - processing
          - shipped
          - delivered
          - canceled
          - unavailable
- name: stg_order_items
  columns:
  - name: order_id
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_orders')
          field: order_id
  - name: product_id
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_products')
          field: product_id
  - name: seller_id
    data_tests:
    - relationships:
        arguments:
          to: ref('stg_sellers')
          field: seller_id
  - name: price
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
          inclusive: false
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - order_id
        - order_item_id
- name: stg_order_payments
  columns:
  - name: payment_value
    data_tests:
    - dbt_utils.accepted_range:
        arguments:
          min_value: 0
  data_tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - order_id
        - payment_sequential
- name: stg_order_reviews
  columns:
  - name: order_id
    data_tests:
    - unique
    - not_null
  - name: review_score
    data_tests:
    - accepted_values:
        arguments:
          values:
          - 1
          - 2
          - 3
          - 4
          - 5
          quote: false
- name: stg_customers
  columns:
  - name: customer_id
    data_tests:
    - unique
    - not_null
  - name: customer_unique_id
    data_tests:
    - not_null
- name: stg_sellers
  columns:
  - name: seller_id
    data_tests:
    - unique
    - not_null
- name: stg_products
  columns:
  - name: product_id
    data_tests:
    - unique
    - not_null
- name: stg_geolocation
  columns:
  - name: zip_code_prefix
    data_tests:
    - unique
    - not_null
