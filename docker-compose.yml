# One-command local stack:  docker compose up -d --build
#   Airflow UI  -> http://localhost:8089  (admin / admin)
#   Warehouse   -> localhost:5434  db=warehouse user=olist password=olist
name: olistpipe

x-airflow: &airflow
  build: ./docker
  image: olistpipe-airflow:latest
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    WAREHOUSE_HOST: postgres
    WAREHOUSE_PORT: "5432"
    DBT_PROFILES_DIR: /opt/project/dbt
    LANDING_DIR: /opt/project/data/landing
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./:/opt/project
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: olist
      POSTGRES_PASSWORD: olist
      POSTGRES_DB: warehouse
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U olist -d warehouse"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    command: >
      bash -c "airflow db migrate &&
               airflow users create --username admin --password admin --firstname a
               --lastname a --role Admin --email admin@example.com || true"
    restart: "no"

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "8089:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pgdata:
